<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 975" role="img" aria-labelledby="t">
  <title id="t">Verschachtelte Kästen: KI umfasst Machine Learning, darin neuronale Netze, darin neuronale Sprachmodelle. Daneben symbolische KI. Natural Language Processing überschneidet sich mit beiden.</title>
  <style>
    text { font-family: "Inter Variable", Inter, "Roboto Variable", Roboto, "Segoe UI", sans-serif; font-weight: 700; fill: #00468a; text-anchor: middle; }
    .lbl { font-size: 34px; }
    .box { fill: none; stroke: #4787e5; stroke-width: 3; }
    .nlp { fill: none; stroke: #2467b8; stroke-width: 3; stroke-dasharray: 14 8; }
  </style>

  <rect x="0" y="0" width="1460" height="975" rx="24" fill="#ebf2fc"/>

  <!-- Artificial Intelligence -->
  <text class="lbl" x="730" y="57">Artificial Intelligence</text>
  <rect class="box" x="37" y="75" width="1385" height="862" rx="14"/>

  <!-- Machine Learning -->
  <text class="lbl" x="748" y="132">Machine Learning</text>
  <rect class="box" x="112" y="150" width="1273" height="560" rx="14"/>

  <!-- Neural Networks & Deep Learning -->
  <text class="lbl" x="608" y="207">Neural Networks &amp; Deep Learning</text>
  <rect class="box" x="150" y="222" width="916" height="450" rx="14"/>

  <!-- Natural Language Processing (overlaps NN and Symbolic AI) -->
  <rect class="nlp" x="75" y="338" width="953" height="524" rx="14"/>
  <text class="lbl" x="551" y="900">Natural Language Processing</text>

  <!-- Neural Language Models -->
  <text class="lbl" x="589" y="395">Neural Language Models</text>
  <rect class="box" x="186" y="413" width="807" height="224" rx="14"/>

  <!-- Highlight -->
  <circle cx="589" cy="525" r="92" fill="#c4e38a"/>
  <text x="589" y="498" font-size="29">Das ist</text>
  <text x="589" y="533" font-size="29">meist</text>
  <text x="589" y="568" font-size="29">gemeint</text>

  <!-- Symbolic AI -->
  <text class="lbl" x="1186" y="757">Symbolic AI</text>
  <rect class="box" x="990" y="775" width="393" height="121" rx="14"/>
</svg>
